<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Punishers — Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --black: #0A0D12;
    --panel: rgba(22,28,38,0.55);
    --panel-hover: rgba(26,33,45,0.65);
    --border: #232A35;
    --blue: #4C8DFF;
    --blue-dim: #2C4A7C;
    --grey: #8B93A1;
    --grey-dim: #565E6C;
    --white: #E8EAED;
    --alert: #FF6B5E;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: linear-gradient(160deg, #0A0D12 0%, #0A0D12 40%, #0F1A2E 75%, #14264A 100%);
    background-attachment: fixed;
    color: var(--white);
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
  }
  header {
    border-bottom: 1px solid var(--border);
    padding: 24px 28px;
    position: sticky;
    top: 0;
    background: rgba(10,13,18,0.75);
    backdrop-filter: blur(10px);
    z-index: 10;
  }
  .header-row {
    max-width: 1000px;
    margin: 0 auto;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 14px;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .brand-name {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700;
    font-size: 22px;
    letter-spacing: -0.3px;
  }
  .brand-sub {
    font-size: 12px;
    color: var(--grey);
    font-weight: 500;
  }
  .status {
    display: flex;
    align-items: center;
    gap: 8px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    color: var(--grey);
  }
  .pulse {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--blue);
    box-shadow: 0 0 0 0 rgba(76,141,255,0.6);
    animation: pulse 2s infinite;
  }
  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(76,141,255,0.5); }
    70% { box-shadow: 0 0 0 8px rgba(76,141,255,0); }
    100% { box-shadow: 0 0 0 0 rgba(76,141,255,0); }
  }
  .ticker-row {
    max-width: 1000px;
    margin: 16px auto 0;
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }
  .pill {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    padding: 6px 12px;
    border-radius: 6px;
    background: rgba(76,141,255,0.08);
    border: 1px solid rgba(76,141,255,0.25);
    color: var(--blue);
  }
  .pill.hot {
    background: rgba(255,107,94,0.1);
    border-color: rgba(255,107,94,0.35);
    color: var(--alert);
  }
  .tabs {
    max-width: 1000px;
    margin: 18px auto 0;
    display: flex;
    gap: 4px;
    border-bottom: 1px solid var(--border);
  }
  .tab-btn {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 600;
    font-size: 14px;
    color: var(--grey);
    background: none;
    border: none;
    padding: 10px 16px;
    cursor: pointer;
    border-bottom: 2px solid transparent;
    transform: translateY(1px);
  }
  .tab-btn:hover { color: var(--white); }
  .tab-btn.active {
    color: var(--white);
    border-bottom-color: var(--blue);
  }
  main {
    max-width: 1000px;
    margin: 0 auto;
    padding: 32px 24px 80px;
  }
  .panel-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
  }
  .panel-grid.single-col { grid-template-columns: 1fr; }
  @media (max-width: 760px) {
    .panel-grid { grid-template-columns: 1fr; }
  }
  .panel {
    background: var(--panel);
    backdrop-filter: blur(8px);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
    transition: border-color 0.15s ease;
  }
  .panel:hover { border-color: var(--blue-dim); }
  .panel-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 16px 18px;
    border-bottom: 1px solid var(--border);
  }
  .panel-label {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 600;
    font-size: 15px;
    color: var(--white);
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .panel-label::before {
    content: '';
    width: 3px;
    height: 14px;
    border-radius: 2px;
    background: var(--blue);
    display: inline-block;
  }
  .panel-updated {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    color: var(--grey-dim);
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .panel-body {
    padding: 16px 18px 20px;
    font-size: 13.5px;
    line-height: 1.6;
  }
  .panel-body ul {
    list-style: none;
    display: grid;
    gap: 10px;
  }
  .panel-body li {
    padding-left: 14px;
    border-left: 2px solid var(--border);
    color: var(--white);
  }
  .panel-body li.flag {
    border-left-color: var(--alert);
  }
  .panel-body li b { color: var(--blue); font-weight: 600; }
  .empty {
    color: var(--grey-dim);
    font-size: 13px;
  }
  .notepad {
    background:
      repeating-linear-gradient(180deg, transparent 0px, transparent 33px, rgba(76,141,255,0.12) 33px, rgba(76,141,255,0.12) 34px),
      var(--panel);
    backdrop-filter: blur(8px);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 20px 20px 20px 44px;
    position: relative;
    min-height: 300px;
  }
  .notepad::before {
    content: '';
    position: absolute;
    left: 30px;
    top: 0;
    bottom: 0;
    width: 1px;
    background: rgba(255,107,94,0.25);
  }
  .note-add-row {
    display: flex;
    gap: 8px;
    margin-bottom: 16px;
  }
  .note-input {
    flex: 1;
    background: rgba(255,255,255,0.04);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 9px 12px;
    color: var(--white);
    font-family: 'Inter', sans-serif;
    font-size: 14px;
    line-height: 33px;
    height: 33px;
  }
  .note-input:focus {
    outline: none;
    border-color: var(--blue-dim);
  }
  .note-add-btn {
    background: var(--blue);
    color: #0A0D12;
    border: none;
    border-radius: 6px;
    padding: 0 18px;
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 600;
    font-size: 14px;
    cursor: pointer;
  }
  .note-add-btn:hover { opacity: 0.88; }
  .note-list {
    list-style: none;
    display: grid;
  }
  .note-item {
    display: flex;
    align-items: center;
    gap: 10px;
    height: 33px;
    font-size: 14px;
    color: var(--white);
  }
  .note-item::before {
    content: '•';
    color: var(--blue);
    font-size: 18px;
    flex-shrink: 0;
  }
  .note-text { flex: 1; }
  .note-del {
    background: none;
    border: none;
    color: var(--grey-dim);
    cursor: pointer;
    font-size: 16px;
    line-height: 1;
    padding: 4px;
    flex-shrink: 0;
  }
  .note-del:hover { color: var(--alert); }
  .note-meta {
    margin-top: 14px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10.5px;
    color: var(--grey-dim);
  }
  footer {
    text-align: center;
    padding: 24px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10.5px;
    color: var(--grey-dim);
  }
  /* ---- live draft board ---- */
  .live {
    background: var(--panel);
    backdrop-filter: blur(8px);
    border: 1px solid var(--border);
    border-radius: 10px;
    margin-bottom: 16px;
    overflow: hidden;
  }
  .live.on-clock { border-color: var(--alert); }
  .live-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 14px 18px;
    border-bottom: 1px solid var(--border);
    flex-wrap: wrap;
    gap: 10px;
  }
  .live-title {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700;
    font-size: 15px;
    display: flex;
    align-items: center;
    gap: 9px;
  }
  .live-dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--alert);
    animation: pulse 2s infinite;
  }
  .live-refresh {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    color: var(--grey-dim);
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .live-stats {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
    gap: 1px;
    background: var(--border);
  }
  .stat {
    background: rgba(16,21,29,0.6);
    padding: 14px 16px;
  }
  .stat-label {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 9.5px;
    color: var(--grey-dim);
    text-transform: uppercase;
    letter-spacing: 0.6px;
    margin-bottom: 5px;
  }
  .stat-value {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700;
    font-size: 19px;
    color: var(--white);
  }
  .stat-value.hot { color: var(--alert); }
  .stat-value.small { font-size: 13.5px; font-weight: 600; }
  .live-section {
    padding: 15px 18px;
    border-top: 1px solid var(--border);
  }
  .live-section h4 {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    color: var(--grey-dim);
    text-transform: uppercase;
    letter-spacing: 0.6px;
    font-weight: 500;
    margin-bottom: 10px;
  }
  .runs { display: flex; gap: 7px; flex-wrap: wrap; }
  .run {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    padding: 5px 10px;
    border-radius: 5px;
    background: rgba(76,141,255,0.08);
    border: 1px solid rgba(76,141,255,0.22);
    color: var(--blue);
  }
  .run.surge {
    background: rgba(255,107,94,0.1);
    border-color: rgba(255,107,94,0.35);
    color: var(--alert);
  }
  .picks { list-style: none; display: grid; gap: 7px; }
  .pick {
    display: flex;
    align-items: baseline;
    gap: 10px;
    font-size: 13px;
    padding-left: 11px;
    border-left: 2px solid var(--border);
  }
  .pick.mine { border-left-color: var(--blue); }
  .pick-no {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--grey-dim);
    min-width: 46px;
  }
  .pick-name { color: var(--white); font-weight: 500; }
  .pick-pos {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--blue);
  }
  .pick-team {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--grey-dim);
    margin-left: auto;
    text-align: right;
  }
  .live-err {
    padding: 15px 18px;
    font-size: 13px;
    color: var(--alert);
    border-top: 1px solid var(--border);
  }
  /* ---- copy-paste briefing ---- */
  .brief {
    background: var(--panel);
    backdrop-filter: blur(8px);
    border: 1px solid var(--border);
    border-radius: 10px;
    margin-top: 16px;
    overflow: hidden;
  }
  .brief-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 14px 18px;
    border-bottom: 1px solid var(--border);
    gap: 12px;
  }
  .brief-title {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 600;
    font-size: 15px;
    color: var(--white);
  }
  .brief-sub {
    font-size: 12px;
    color: var(--grey);
    padding: 12px 18px 0;
  }
  .brief-btn {
    background: var(--blue);
    color: #0A0D12;
    border: none;
    border-radius: 6px;
    padding: 8px 16px;
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 600;
    font-size: 13px;
    cursor: pointer;
    flex-shrink: 0;
  }
  .brief-btn:hover { opacity: 0.88; }
  .brief-btn.done { background: #3FBF7F; }
  .brief pre {
    margin: 12px 18px 18px;
    padding: 14px 16px;
    background: rgba(0,0,0,0.28);
    border: 1px solid var(--border);
    border-radius: 7px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    line-height: 1.65;
    color: var(--white);
    white-space: pre-wrap;
    word-break: break-word;
    max-height: 330px;
    overflow-y: auto;
  }
</style>
</head>
<body>
<header>
  <div class="header-row">
    <div class="brand">
      <div>
        <div class="brand-name">The Punishers</div>
        <div class="brand-sub">MFL &middot; 12-team PPR</div>
      </div>
    </div>
    <div class="status"><span class="pulse"></span><span id="sync-time">connecting…</span></div>
  </div>
  <div class="ticker-row" id="ticker"></div>
</header>
<nav class="tabs" id="tabs"></nav>
<main id="panels"></main>
<footer>Updates when scheduled tasks push to data.json &middot; reload to refresh</footer>
<script>
const TABS = [
  {
    id: 'draft-prep',
    label: 'Draft Prep',
    single: true,
    panels: [
      { key: 'pre_draft', label: 'Draft Prep — Cheat Sheet Highlights' },
    ],
  },
  {
    id: 'draft-strategy',
    label: 'Draft Strategy',
    single: true,
    panels: [
      { key: 'draft_strategy', label: 'Draft Strategy & Game Plan' },
    ],
  },
  {
    id: 'draft-day',
    label: 'Draft Day',
    single: true,
    panels: [
      { key: 'draft_day', label: 'Live Draft Tracker' },
    ],
  },
  {
    id: 'season',
    label: 'Season',
    single: false,
    panels: [
      { key: 'injury_radar', label: 'Injury & Opportunity' },
      { key: 'trade_radar', label: 'League Trade Radar' },
      { key: 'trend_tracker', label: 'Efficiency & Trends' },
      { key: 'lineup_lock', label: 'Sunday Lineup Lock' },
      { key: 'camp_watch', label: 'Camp & Trending Watch' },
    ],
  },
  {
    id: 'colts',
    label: 'Colts',
    single: true,
    panels: [
      { key: 'colts_watch', label: 'Indianapolis Colts Watch' },
    ],
  },
  {
    id: 'notes',
    label: 'Notes',
    single: true,
    isNotepad: true,
  },
];
let activeTab = 'season';   // season is live now; draft tabs are archival
let currentData = {};

/* ================= LIVE DRAFT BOARD ================= */
const DRAFT_ID = '1325388108576849920';
const TEAMS = 12;
const ROUNDS = 16;
const MY_SLOT = 11;                       // confirmed from draft_order
const MY_PICKS = [11,14,35,38,59,62,83,86,107,110,131,134,155,158,179,182];
// slot -> team name, derived from slot_to_roster_id + league users
const SLOT_TEAM = {
  1:'Indiana Firebirds', 2:'Sir Loin of House Steak', 3:'Pissing Excellence',
  4:'Derri-Lick My Balls 2x', 5:'Juice 4x', 6:'KeeganDodd',
  7:'got pasta', 8:"IPlay's Regime", 9:'The Bums',
  10:'Magic in the Hampton 2', 11:'THE PUNISHERS (you)', 12:'Men of Stiggle'
};
let draftTimer = null;
let bigBoard = [];   // league-adjusted best-available board, from data.json

function draftedNameSet(picks) {
  const s = new Set();
  picks.forEach(p => {
    const m = p.metadata || {};
    const name = ((m.first_name || '') + ' ' + (m.last_name || '')).trim().toLowerCase();
    if (name) s.add(name);
  });
  return s;
}

function bestAvailableHTML(picks) {
  if (!bigBoard.length) return '';
  const drafted = draftedNameSet(picks);
  const available = bigBoard.filter(p => !drafted.has(String(p.name || '').trim().toLowerCase()));

  const positions = ['QB', 'RB', 'WR', 'TE'];
  const topByPos = positions.map(pos => ({
    pos,
    best: available.filter(p => p.pos === pos).slice(0, 3)
  }));

  return `
    <div class="live-section">
      <h4>Best available — adjusted for this league's scoring</h4>
      <div class="panel-grid single-col" style="gap:10px;">
        ${topByPos.map(({ pos, best }) => `
          <div>
            <div class="run" style="display:inline-block;margin-bottom:6px;">${pos}</div>
            <ul class="picks">
              ${best.length ? best.map(p => `
                <li class="pick">
                  <span class="pick-name">${p.name}</span>
                  <span class="pick-pos">T${p.tier} &middot; ${p.team}</span>
                  ${p.note ? `<span class="pick-team" style="text-align:left;flex:1;">${p.note}</span>` : ''}
                </li>
              `).join('') : '<li class="empty">Tier exhausted</li>'}
            </ul>
          </div>
        `).join('')}
      </div>
    </div>
  `;
}

function slotForPick(n) {
  const round = Math.ceil(n / TEAMS);
  const idx = ((n - 1) % TEAMS) + 1;
  return round % 2 === 1 ? idx : TEAMS + 1 - idx;   // snake
}
function nextMyPick(current) {
  return MY_PICKS.find(p => p >= current) || null;
}

async function pollDraft() {
  const box = document.getElementById('live-board');
  if (!box) { clearInterval(draftTimer); draftTimer = null; return; }

  let picks;
  try {
    const res = await fetch(`https://api.sleeper.app/v1/draft/${DRAFT_ID}/picks?t=${Date.now()}`);
    picks = await res.json();
  } catch (e) {
    box.innerHTML = `<div class="live-err">Can't reach Sleeper right now — retrying in 15s. Check the Sleeper app directly.</div>`;
    return;
  }
  if (!Array.isArray(picks)) picks = [];

  const made = picks.length;
  const total = TEAMS * ROUNDS;
  const current = made + 1;
  const done = made >= total;

  const onSlot = done ? null : slotForPick(current);
  const myNext = nextMyPick(current);
  const until = myNext ? myNext - current : null;
  const onClock = onSlot === MY_SLOT;

  // positional runs across the last 12 picks
  const recent = picks.slice(-12);
  const counts = {};
  recent.forEach(p => {
    const pos = (p.metadata && p.metadata.position) || '?';
    counts[pos] = (counts[pos] || 0) + 1;
  });
  const runs = Object.entries(counts).sort((a, b) => b[1] - a[1]);

  const last = picks.slice(-10).reverse();

  box.className = 'live' + (onClock ? ' on-clock' : '');
  box.innerHTML = `
    <div class="live-head">
      <div class="live-title"><span class="live-dot"></span>${done ? 'Draft Complete' : (made === 0 ? 'Draft Not Started' : 'Live Draft Board')}</div>
      <div class="live-refresh">auto-refresh 15s &middot; ${new Date().toLocaleTimeString()}</div>
    </div>
    <div class="live-stats">
      <div class="stat">
        <div class="stat-label">Picks Made</div>
        <div class="stat-value">${made} <span style="font-size:13px;color:var(--grey-dim)">/ ${total}</span></div>
      </div>
      <div class="stat">
        <div class="stat-label">On The Clock</div>
        <div class="stat-value small ${onClock ? 'hot' : ''}">${done ? '—' : (SLOT_TEAM[onSlot] || ('Slot ' + onSlot))}</div>
      </div>
      <div class="stat">
        <div class="stat-label">Your Next Pick</div>
        <div class="stat-value">${myNext || '—'}</div>
      </div>
      <div class="stat">
        <div class="stat-label">${onClock ? 'Status' : 'Picks Until You'}</div>
        <div class="stat-value ${onClock || (until !== null && until <= 3) ? 'hot' : ''}">${onClock ? 'PICK NOW' : (until === null ? '—' : until)}</div>
      </div>
    </div>
    ${runs.length ? `
      <div class="live-section">
        <h4>Position runs — last ${recent.length} picks</h4>
        <div class="runs">
          ${runs.map(([pos, n]) => `<div class="run ${n >= 4 ? 'surge' : ''}">${pos} &times;${n}</div>`).join('')}
        </div>
      </div>` : ''}
    <div class="live-section">
      <h4>Most recent picks</h4>
      ${last.length ? `<ul class="picks">${last.map(p => {
        const m = p.metadata || {};
        const mine = p.draft_slot === MY_SLOT;
        return `<li class="pick ${mine ? 'mine' : ''}">
          <span class="pick-no">${p.round}.${String(p.pick_no - (p.round - 1) * TEAMS).padStart(2, '0')}</span>
          <span class="pick-name">${(m.first_name || '') + ' ' + (m.last_name || '')}</span>
          <span class="pick-pos">${m.position || ''}${m.team ? ' · ' + m.team : ''}</span>
          <span class="pick-team">${SLOT_TEAM[p.draft_slot] || ''}</span>
        </li>`;
      }).join('')}</ul>` : '<div class="empty">No picks yet — board goes live when the draft starts.</div>'}
    </div>
    ${bestAvailableHTML(picks)}
  `;
}

function startDraftPolling() {
  if (draftTimer) clearInterval(draftTimer);
  pollDraft();
  draftTimer = setInterval(pollDraft, 15000);
}

/* ================= LIVE SEASON BOARD =================
   Fetches straight from Sleeper in the browser on every page load.
   No dependency on a scheduled task, a laptop being awake, or a git push. */
const LEAGUE_ID = '1325388108564291584';
const MY_ROSTER_ID = 3;
const SLOT_LABELS = ['QB', 'RB', 'RB', 'WR', 'WR', 'WR', 'TE', 'FLEX', 'K'];
const NAMES_KEY = 'punishers_names_v1';
let seasonTimer = null;
let nameMap = null;
let injuryMap = null;   // only populated on demand — see loadInjuries()

const api = (path) => fetch('https://api.sleeper.app/v1' + path).then(r => r.json());

/* Names come from the draft picks endpoint (~83KB) rather than the full
   player map (~5MB). Cached in localStorage; rosters rarely gain undrafted
   players, and any that appear fall back to showing the raw ID. */
async function ensureNames() {
  if (nameMap) return nameMap;
  try {
    const cached = JSON.parse(localStorage.getItem(NAMES_KEY));
    if (cached && cached.v === 1 && cached.map) { nameMap = cached.map; return nameMap; }
  } catch (e) { /* ignore */ }
  const picks = await api('/draft/' + DRAFT_ID + '/picks');
  const m = {};
  (picks || []).forEach(p => {
    const md = p.metadata || {};
    m[p.player_id] = {
      n: ((md.first_name || '') + ' ' + (md.last_name || '')).trim(),
      p: md.position || '',
      t: md.team || ''
    };
  });
  nameMap = m;
  try { localStorage.setItem(NAMES_KEY, JSON.stringify({ v: 1, map: m })); } catch (e) { /* quota */ }
  return nameMap;
}

function nm(id) {
  const e = (nameMap && nameMap[id]) || null;
  return e || { n: '#' + id, p: '', t: '' };
}

function playerRow(id, pts, slot) {
  const e = nm(id);
  const inj = injuryMap && injuryMap[id];
  const bad = inj && /out|doubtful|ir/i.test(inj);
  return `<li class="pick ${bad ? 'mine' : ''}" ${bad ? 'style="border-left-color:var(--alert)"' : ''}>
    ${slot ? `<span class="pick-no">${slot}</span>` : ''}
    <span class="pick-name">${e.n}</span>
    <span class="pick-pos">${e.p}${e.t ? ' · ' + e.t : ''}${inj ? ' · <span style="color:var(--alert)">' + inj + '</span>' : ''}</span>
    <span class="pick-team">${typeof pts === 'number' ? pts.toFixed(1) : ''}</span>
  </li>`;
}

async function pollSeason() {
  const box = document.getElementById('season-board');
  if (!box) { if (seasonTimer) clearInterval(seasonTimer); seasonTimer = null; return; }

  let state, rosters, users, matchups;
  try {
    await ensureNames();
    state = await api('/state/nfl');
    if (state.season_type !== 'regular' || !state.week) {
      box.innerHTML = `<div class="live-head"><div class="live-title">Season Board</div></div>
        <div class="live-err" style="color:var(--grey)">Not in the regular season — nothing live to show.</div>`;
      return;
    }
    [rosters, users, matchups] = await Promise.all([
      api('/league/' + LEAGUE_ID + '/rosters'),
      api('/league/' + LEAGUE_ID + '/users'),
      api('/league/' + LEAGUE_ID + '/matchups/' + state.week)
    ]);
  } catch (e) {
    box.innerHTML = `<div class="live-err">Can't reach Sleeper right now — retrying. Check the Sleeper app directly.</div>`;
    return;
  }

  const teamOf = {};
  const userById = {};
  (users || []).forEach(u => { userById[u.user_id] = (u.metadata && u.metadata.team_name) || u.display_name; });
  (rosters || []).forEach(r => { teamOf[r.roster_id] = userById[r.owner_id] || ('Roster ' + r.roster_id); });

  const me = (matchups || []).find(m => m.roster_id === MY_ROSTER_ID);
  const myRoster = (rosters || []).find(r => r.roster_id === MY_ROSTER_ID);
  if (!me || !myRoster) {
    box.innerHTML = `<div class="live-err">Couldn't find roster ${MY_ROSTER_ID} in week ${state.week}.</div>`;
    return;
  }
  const opp = (matchups || []).find(m => m.matchup_id === me.matchup_id && m.roster_id !== MY_ROSTER_ID);

  const starters = me.starters || [];
  const pts = me.players_points || {};
  const benchIds = (me.players || []).filter(p => !starters.includes(p));
  const myPts = me.points || 0;
  const oppPts = opp ? (opp.points || 0) : 0;
  const lead = myPts - oppPts;

  // league median — this league also scores you against it every week
  const allPts = (matchups || []).map(m => m.points || 0).sort((a, b) => a - b);
  const mid = allPts.length ? (allPts[Math.floor((allPts.length - 1) / 2)] + allPts[Math.ceil((allPts.length - 1) / 2)]) / 2 : 0;

  box.className = 'live';
  box.innerHTML = `
    <div class="live-head">
      <div class="live-title"><span class="live-dot"></span>Week ${state.week} — Live</div>
      <div class="live-refresh">straight from Sleeper &middot; ${new Date().toLocaleTimeString()}</div>
    </div>
    <div class="live-stats">
      <div class="stat"><div class="stat-label">The Punishers</div><div class="stat-value">${myPts.toFixed(1)}</div></div>
      <div class="stat"><div class="stat-label">${opp ? teamOf[opp.roster_id] : 'Opponent'}</div><div class="stat-value">${oppPts.toFixed(1)}</div></div>
      <div class="stat"><div class="stat-label">H2H Margin</div><div class="stat-value ${lead < 0 ? 'hot' : ''}">${lead >= 0 ? '+' : ''}${lead.toFixed(1)}</div></div>
      <div class="stat"><div class="stat-label">vs League Median</div><div class="stat-value ${myPts < mid ? 'hot' : ''}">${(myPts - mid >= 0 ? '+' : '') + (myPts - mid).toFixed(1)}</div></div>
    </div>
    <div class="live-section">
      <h4>Starting lineup</h4>
      <ul class="picks">${starters.map((id, i) => id && id !== '0'
        ? playerRow(id, pts[id], SLOT_LABELS[i])
        : `<li class="pick" style="border-left-color:var(--alert)"><span class="pick-no">${SLOT_LABELS[i]}</span><span class="pick-name" style="color:var(--alert)">EMPTY SLOT</span></li>`
      ).join('')}</ul>
    </div>
    <div class="live-section">
      <h4>Bench</h4>
      <ul class="picks">${benchIds.map(id => playerRow(id, pts[id], '')).join('')}</ul>
    </div>
    <div class="live-section">
      <h4>Injury designations</h4>
      ${injuryMap
        ? '<div class="empty">Loaded — shown inline above. Blank means no designation.</div>'
        : '<button class="brief-btn" id="inj-btn">Load injury status</button><div class="brief-sub" style="padding:8px 0 0;">Optional — pulls Sleeper\'s full player file (~5MB). Skip it on cellular.</div>'}
    </div>
  `;

  const ib = document.getElementById('inj-btn');
  if (ib) ib.addEventListener('click', loadInjuries);
}

async function loadInjuries() {
  const btn = document.getElementById('inj-btn');
  if (btn) { btn.textContent = 'Loading ~5MB…'; btn.disabled = true; }
  try {
    const all = await api('/players/nfl');
    injuryMap = {};
    Object.keys(all).forEach(id => {
      const s = all[id] && all[id].injury_status;
      if (s) injuryMap[id] = s;
    });
  } catch (e) {
    if (btn) { btn.textContent = 'Failed — tap to retry'; btn.disabled = false; }
    return;
  }
  pollSeason();
}

/* 2026 NFL bye weeks (NFL.com, schedule release). No byes in weeks 1-4, 12, 15-18. */
const TEAM_BYE = {
  CAR:5, KC:5,
  CIN:6, DET:6, MIA:6, MIN:6,
  BUF:7, JAX:7, LAC:7, WAS:7,
  HOU:8, NO:8, NYG:8, SF:8,
  PIT:9, TEN:9,
  CHI:10, DEN:10, PHI:10, TB:10,
  ATL:11, CLE:11, GB:11, LAR:11, LA:11, NE:11, SEA:11,
  BAL:13, IND:13, LV:13, NYJ:13,
  ARI:14, AZ:14, DAL:14
};
const NEED = { QB: 1, RB: 2, WR: 3, TE: 1, K: 1 };   // FLEX filled from leftover RB/WR/TE

/* Can a legal lineup be fielded in week w, given byes? Returns list of unfillable slots. */
function slotGaps(playerIds, week) {
  const avail = {};
  playerIds.forEach(id => {
    const e = nm(id);
    if (!e.p) return;
    if (TEAM_BYE[e.t] === week) return;     // on bye
    avail[e.p] = (avail[e.p] || 0) + 1;
  });
  const gaps = [];
  let spare = 0;
  Object.keys(NEED).forEach(pos => {
    const have = avail[pos] || 0;
    const need = NEED[pos];
    if (have < need) { for (let i = 0; i < need - have; i++) gaps.push(pos); }
    else if (pos !== 'K' && pos !== 'QB') spare += have - need;
  });
  if (spare < 1) gaps.push('FLEX');
  return gaps;
}

function byePlannerHTML(playerIds, currentWeek) {
  const rows = [];
  for (let w = currentWeek; w <= 14; w++) {
    const onBye = playerIds.filter(id => TEAM_BYE[nm(id).t] === w);
    if (!onBye.length) continue;
    const gaps = slotGaps(playerIds, w);
    rows.push({ w, onBye, gaps });
  }
  if (!rows.length) return '';
  return `
    <div class="live-section">
      <h4>Bye-week planner — next unfillable slots</h4>
      <ul class="picks">
        ${rows.map(r => `
          <li class="pick" ${r.gaps.length ? 'style="border-left-color:var(--alert)"' : ''}>
            <span class="pick-no">WK ${r.w}</span>
            <span class="pick-name" ${r.gaps.length ? 'style="color:var(--alert)"' : ''}>
              ${r.gaps.length ? 'CANNOT FILL: ' + r.gaps.join(', ') : 'Coverable'}
            </span>
            <span class="pick-pos">${r.onBye.map(id => nm(id).n + ' (' + nm(id).t + ')').join(', ')}</span>
          </li>
        `).join('')}
      </ul>
    </div>
  `;
}

function faabHTML(rosters, teamOf) {
  const budget = 200;
  const rows = (rosters || []).map(r => ({
    name: teamOf[r.roster_id] || ('Roster ' + r.roster_id),
    left: budget - ((r.settings && r.settings.waiver_budget_used) || 0),
    me: r.roster_id === MY_ROSTER_ID
  })).sort((a, b) => b.left - a.left);
  return `
    <div class="live-section">
      <h4>FAAB remaining — who can outbid you</h4>
      <ul class="picks">
        ${rows.map(r => `
          <li class="pick" ${r.me ? 'style="border-left-color:var(--blue)"' : ''}>
            <span class="pick-name" ${r.me ? 'style="color:var(--blue)"' : ''}>${r.name}</span>
            <span class="pick-team">$${r.left}</span>
          </li>`).join('')}
      </ul>
    </div>
  `;
}

function startSeasonPolling() {
  if (seasonTimer) clearInterval(seasonTimer);
  pollSeason();
  seasonTimer = setInterval(pollSeason, 30000);
}

/* Copy-paste briefing — bring a fresh Claude chat up to speed in one paste */
const BRIEF = [
  "I'm drafting in my Sleeper fantasy football league. Here's everything you need:",
  "",
  "LEAGUE: \"MFL\" — Sleeper league ID 1325388108564291584, 2026 season, 12 teams, full PPR",
  "DRAFT: draft ID 1325388108576849920 — 16-round snake, 120-second pick timer, CPU autopick ON",
  "ME: username mohrn, team \"The Punishers\", user_id 992218322173255680, roster_id 3",
  "MY DRAFT SLOT: 11 of 12",
  "MY PICKS: 11, 14, 35, 38, 59, 62, 83, 86, 107, 110, 131, 134, 155, 158, 179, 182",
  "",
  "LINEUP: QB, RB, RB, WR, WR, WR, TE, FLEX, K + 7 bench, 2 IR.",
  "There is NO team-defense slot — never suggest a DEF. A kicker IS required; take one with the last pick (182).",
  "",
  "SCORING QUIRKS THAT CHANGE VALUE:",
  "- Full PPR, 1.0 per reception, 0.1 per receiving yard",
  "- 0.1 points per RUSH ATTEMPT — volume backs are worth more here than standard PPR (a 280-carry back banks 28 pts on volume alone)",
  "- Pass TD only 4, pass yards 0.05 — QBs are devalued, wait until picks 83-110",
  "- 100-yard rush bonus 2.5, 200-yard 6.0",
  "- league_average_match is ON: I also play the league median every week, so consistency beats boom/bust",
  "- NO KEEPERS. 7 of 12 teams make the playoffs, starting week 15",
  "- Because no DEF is drafted, the board plays ~14 picks deeper than public ADP implies",
  "",
  "STRUCTURAL NOTE: I pick at 11 and 14 nearly back-to-back, then wait 20 picks until 35. Treat 11/14 as one decision.",
  "",
  "LIVE PICKS: https://api.sleeper.app/v1/draft/1325388108576849920/picks",
  "(each pick's metadata contains first_name, last_name, position, team — no player-ID lookup needed)",
  "MY DASHBOARD: https://mohrn8.github.io/punishers-dashboard/",
  "",
  "Please fetch the live picks and help me decide who to take."
].join("\n");

function briefHTML() {
  return '<div class="brief">'
    + '<div class="brief-head"><div class="brief-title">Draft Day Briefing</div>'
    + '<button class="brief-btn" id="brief-btn">Copy</button></div>'
    + '<div class="brief-sub">On a different computer? Paste this into a fresh Claude chat and it will know your league, slot, and scoring instantly.</div>'
    + '<pre id="brief-text"></pre></div>';
}

function wireBrief() {
  const pre = document.getElementById('brief-text');
  if (!pre) return;
  pre.textContent = BRIEF;
  const btn = document.getElementById('brief-btn');
  btn.addEventListener('click', async () => {
    try {
      await navigator.clipboard.writeText(BRIEF);
    } catch (e) {
      const r = document.createRange();
      r.selectNodeContents(pre);
      const s = window.getSelection();
      s.removeAllRanges();
      s.addRange(r);
      return;
    }
    btn.textContent = 'Copied';
    btn.classList.add('done');
    setTimeout(() => { btn.textContent = 'Copy'; btn.classList.remove('done'); }, 1800);
  });
}
/* =============== END LIVE DRAFT BOARD =============== */
function renderItems(items) {
  if (!items || !items.length) return '<div class="empty">No updates yet — waiting on first scheduled run.</div>';
  return '<ul>' + items.map(item => {
    const cls = item.flag ? 'flag' : '';
    return `<li class="${cls}">${item.text}</li>`;
  }).join('') + '</ul>';
}
function timeAgo(iso) {
  if (!iso) return '—';
  const diff = Date.now() - new Date(iso).getTime();
  const mins = Math.round(diff / 60000);
  if (mins < 60) return mins + 'm ago';
  const hrs = Math.round(mins / 60);
  if (hrs < 48) return hrs + 'h ago';
  return Math.round(hrs / 24) + 'd ago';
}
function renderTabs() {
  const tabsNav = document.getElementById('tabs');
  tabsNav.innerHTML = TABS.map(t =>
    `<button class="tab-btn ${t.id === activeTab ? 'active' : ''}" data-tab="${t.id}">${t.label}</button>`
  ).join('');
  tabsNav.querySelectorAll('.tab-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      activeTab = btn.dataset.tab;
      renderTabs();
      renderPanels();
    });
  });
}
const NOTES_KEY = 'punishers_notes_v1';
function getNotes() {
  try {
    return JSON.parse(localStorage.getItem(NOTES_KEY)) || [];
  } catch (e) {
    return [];
  }
}
function saveNotes(notes) {
  localStorage.setItem(NOTES_KEY, JSON.stringify(notes));
}
function renderNotepad() {
  const notes = getNotes();
  const main = document.getElementById('panels');
  main.innerHTML = `
    <div class="notepad">
      <div class="note-add-row">
        <input type="text" class="note-input" id="note-input" placeholder="Add a note or data point…" />
        <button class="note-add-btn" id="note-add-btn">Add</button>
      </div>
      <ul class="note-list" id="note-list"></ul>
      <div class="note-meta">Saved in this browser only &middot; ${notes.length} note${notes.length === 1 ? '' : 's'}</div>
    </div>
  `;
  const list = document.getElementById('note-list');
  list.innerHTML = notes.map((n, i) => `
    <li class="note-item">
      <span class="note-text">${n.text}</span>
      <button class="note-del" data-idx="${i}">&times;</button>
    </li>
  `).join('') || '<li class="empty" style="list-style:none;">No notes yet — add one above.</li>';
  list.querySelectorAll('.note-del').forEach(btn => {
    btn.addEventListener('click', () => {
      const idx = parseInt(btn.dataset.idx, 10);
      const updated = getNotes();
      updated.splice(idx, 1);
      saveNotes(updated);
      renderNotepad();
    });
  });
  function addNote() {
    const input = document.getElementById('note-input');
    const text = input.value.trim();
    if (!text) return;
    const updated = getNotes();
    updated.push({ text, added: new Date().toISOString() });
    saveNotes(updated);
    renderNotepad();
    document.getElementById('note-input').focus();
  }
  document.getElementById('note-add-btn').addEventListener('click', addNote);
  document.getElementById('note-input').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') addNote();
  });
  document.getElementById('note-input').focus();
}
function renderPanels() {
  const tab = TABS.find(t => t.id === activeTab);

  // leaving a live tab stops its poll
  if (tab.id !== 'draft-day' && draftTimer) { clearInterval(draftTimer); draftTimer = null; }
  if (tab.id !== 'season' && seasonTimer) { clearInterval(seasonTimer); seasonTimer = null; }

  if (tab.isNotepad) {
    renderNotepad();
    return;
  }
  const main = document.getElementById('panels');
  const liveBoard = tab.id === 'draft-day'
    ? '<div class="live" id="live-board"><div class="live-head"><div class="live-title">Loading live board…</div></div></div>'
    : tab.id === 'season'
    ? '<div class="live" id="season-board" style="margin-bottom:16px;"><div class="live-head"><div class="live-title">Loading live season board…</div></div></div>'
    : '';
  main.innerHTML = liveBoard + `<div class="panel-grid ${tab.single ? 'single-col' : ''}">` +
    tab.panels.map(cfg => {
      const section = (currentData.sections && currentData.sections[cfg.key]) || {};
      return `
        <div class="panel">
          <div class="panel-head">
            <div class="panel-label">${cfg.label}</div>
            <div class="panel-updated">${section.updated ? timeAgo(section.updated) : 'never run'}</div>
          </div>
          <div class="panel-body">${renderItems(section.items)}</div>
        </div>
      `;
    }).join('') + '</div>'
    + (tab.id === 'draft-day' ? briefHTML() : '');

  if (tab.id === 'draft-day') {
    startDraftPolling();
    wireBrief();
  }
  if (tab.id === 'season') startSeasonPolling();
}
async function load() {
  let data = {};
  try {
    const res = await fetch('data.json?t=' + Date.now());
    data = await res.json();
  } catch (e) {
    data = {};
  }
  currentData = data;
  bigBoard = data.big_board || [];
  document.getElementById('sync-time').textContent = data.last_sync ? 'synced ' + timeAgo(data.last_sync) : 'no data yet';
  const ticker = document.getElementById('ticker');
  ticker.innerHTML = (data.ticker || []).map(t =>
    `<div class="pill ${t.hot ? 'hot' : ''}">${t.text}</div>`
  ).join('') || '<div class="pill">No alerts yet</div>';
  renderTabs();
  renderPanels();
}
load();
</script>
