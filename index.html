<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Punishers — Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --black: #0A0D12;
    --panel: rgba(22,28,38,0.55);
    --panel-hover: rgba(26,33,45,0.65);
    --border: #232A35;
    --blue: #4C8DFF;
    --blue-dim: #2C4A7C;
    --grey: #8B93A1;
    --grey-dim: #565E6C;
    --white: #E8EAED;
    --alert: #FF6B5E;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: linear-gradient(160deg, #0A0D12 0%, #0A0D12 40%, #0F1A2E 75%, #14264A 100%);
    background-attachment: fixed;
    color: var(--white);
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
  }

  header {
    border-bottom: 1px solid var(--border);
    padding: 24px 28px;
    position: sticky;
    top: 0;
    background: rgba(10,13,18,0.75);
    backdrop-filter: blur(10px);
    z-index: 10;
  }
  .header-row {
    max-width: 1000px;
    margin: 0 auto;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 14px;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .brand-name {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700;
    font-size: 22px;
    letter-spacing: -0.3px;
  }
  .brand-sub {
    font-size: 12px;
    color: var(--grey);
    font-weight: 500;
  }
  .status {
    display: flex;
    align-items: center;
    gap: 8px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    color: var(--grey);
  }
  .pulse {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--blue);
    box-shadow: 0 0 0 0 rgba(76,141,255,0.6);
    animation: pulse 2s infinite;
  }
  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(76,141,255,0.5); }
    70% { box-shadow: 0 0 0 8px rgba(76,141,255,0); }
    100% { box-shadow: 0 0 0 0 rgba(76,141,255,0); }
  }

  .ticker-row {
    max-width: 1000px;
    margin: 16px auto 0;
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }
  .pill {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    padding: 6px 12px;
    border-radius: 6px;
    background: rgba(76,141,255,0.08);
    border: 1px solid rgba(76,141,255,0.25);
    color: var(--blue);
  }
  .pill.hot {
    background: rgba(255,107,94,0.1);
    border-color: rgba(255,107,94,0.35);
    color: var(--alert);
  }

  main {
    max-width: 1000px;
    margin: 0 auto;
    padding: 32px 24px 80px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
  }
  @media (max-width: 760px) {
    main { grid-template-columns: 1fr; }
  }

  .panel {
    background: var(--panel);
    backdrop-filter: blur(8px);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
    transition: border-color 0.15s ease;
  }
  .panel:hover { border-color: var(--blue-dim); }

  .panel-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 16px 18px;
    border-bottom: 1px solid var(--border);
  }
  .panel-label {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 600;
    font-size: 15px;
    color: var(--white);
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .panel-label::before {
    content: '';
    width: 3px;
    height: 14px;
    border-radius: 2px;
    background: var(--blue);
    display: inline-block;
  }
  .panel-updated {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    color: var(--grey-dim);
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .panel-body {
    padding: 16px 18px 20px;
    font-size: 13.5px;
    line-height: 1.6;
  }
  .panel-body ul {
    list-style: none;
    display: grid;
    gap: 10px;
  }
  .panel-body li {
    padding-left: 14px;
    border-left: 2px solid var(--border);
    color: var(--white);
  }
  .panel-body li.flag {
    border-left-color: var(--alert);
  }
  .panel-body li b { color: var(--blue); font-weight: 600; }
  .empty {
    color: var(--grey-dim);
    font-size: 13px;
  }

  footer {
    text-align: center;
    padding: 24px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10.5px;
    color: var(--grey-dim);
  }
</style>
</head>
<body>

<header>
  <div class="header-row">
    <div class="brand">
      <div>
        <div class="brand-name">The Punishers</div>
        <div class="brand-sub">MFL &middot; 12-team PPR</div>
      </div>
    </div>
    <div class="status"><span class="pulse"></span><span id="sync-time">connecting…</span></div>
  </div>
  <div class="ticker-row" id="ticker"></div>
</header>

<main id="panels"></main>

<footer>Updates when scheduled tasks push to data.json &middot; reload to refresh</footer>

<script>
const PANEL_CONFIG = [
  { key: 'injury_radar', label: 'Injury & Opportunity' },
  { key: 'trade_radar', label: 'League Trade Radar' },
  { key: 'trend_tracker', label: 'Efficiency & Trends' },
  { key: 'lineup_lock', label: 'Sunday Lineup Lock' },
];

function renderItems(items) {
  if (!items || !items.length) return '<div class="empty">No updates yet — waiting on first scheduled run.</div>';
  return '<ul>' + items.map(item => {
    const cls = item.flag ? 'flag' : '';
    return `<li class="${cls}">${item.text}</li>`;
  }).join('') + '</ul>';
}

function timeAgo(iso) {
  if (!iso) return '—';
  const diff = Date.now() - new Date(iso).getTime();
  const mins = Math.round(diff / 60000);
  if (mins < 60) return mins + 'm ago';
  const hrs = Math.round(mins / 60);
  if (hrs < 48) return hrs + 'h ago';
  return Math.round(hrs / 24) + 'd ago';
}

async function load() {
  let data = {};
  try {
    const res = await fetch('data.json?t=' + Date.now());
    data = await res.json();
  } catch (e) {
    data = {};
  }

  document.getElementById('sync-time').textContent = data.last_sync ? 'synced ' + timeAgo(data.last_sync) : 'no data yet';

  const ticker = document.getElementById('ticker');
  ticker.innerHTML = (data.ticker || []).map(t =>
    `<div class="pill ${t.hot ? 'hot' : ''}">${t.text}</div>`
  ).join('') || '<div class="pill">No alerts yet</div>';

  const main = document.getElementById('panels');
  main.innerHTML = PANEL_CONFIG.map(cfg => {
    const section = (data.sections && data.sections[cfg.key]) || {};
    return `
      <div class="panel">
        <div class="panel-head">
          <div class="panel-label">${cfg.label}</div>
          <div class="panel-updated">${section.updated ? timeAgo(section.updated) : 'never run'}</div>
        </div>
        <div class="panel-body">${renderItems(section.items)}</div>
      </div>
    `;
  }).join('');
}

load();
</script>
</body>
</html>
